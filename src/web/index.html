<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Municipal Sanitation & Health data workbench: mapping, organization, workflows and automation proposals." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b6472'/%3E%3Cpath d='M5 5h5v5H5zM14 5h5v9h-5zM5 14h5v5H5zM14 18h5v1h-5z' fill='white'/%3E%3C/svg%3E" />
    <title>Municipal data workbench</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
      <div class="wrap header-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" focusable="false">
              <path d="M4 4h6v6H4zM14 4h6v10h-6zM4 14h6v6H4zM14 18h6v2h-6z" />
            </svg>
          </span>
          <div class="brand-text">
            <p class="eyebrow">Sanitation &amp; Health · municipal data platform</p>
            <h1 class="brand-name">
              <span id="org-name">Municipal data workbench</span>
              <span id="org-he" class="brand-he"></span>
            </h1>
            <p class="brand-meta" id="org-meta">Reading the organization profile from the API…</p>
          </div>
        </div>
        <div class="header-side">
          <span class="badge">POC</span>
          <span class="muted small">Read-only workbench</span>
        </div>
      </div>
      <div class="wrap tabs-wrap">
        <div class="tabs" role="tablist" aria-label="Workbench sections" id="tabs"></div>
      </div>
    </header>

    <main id="main" class="wrap" tabindex="-1">
      <section id="panel" class="panel" role="tabpanel" aria-labelledby="tab-overview" tabindex="0" aria-busy="true">
        <div class="state" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <p>Loading the workbench…</p>
        </div>
      </section>
      <noscript>
        <div class="state error"><p>This workbench needs JavaScript to read the API. Enable it and reload.</p></div>
      </noscript>
    </main>

    <footer class="app-footer">
      <div class="wrap footer-row">
        <p>Proof of concept · every figure on this page is read from the live API.</p>
        <p id="footer-meta" class="muted"></p>
      </div>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
